name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: day11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install fastapi httpx pydantic python-dotenv requests scikit-learn langgraph streamlit pytest ruff
      - name: Lint with ruff
        run: ruff check .
      - name: Run tests
        run: python -m pytest

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t cybersuraksha:ci day11
      - name: Check the compose file
        run: docker compose -f day11/docker-compose.yml config --quiet